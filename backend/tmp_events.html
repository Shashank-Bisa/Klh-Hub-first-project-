<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Events - KLH Campus Hub</title>
  <link rel="stylesheet" href="/assets/events.css" />
  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#f8fafc;color:#0f172a;padding:24px}
    .container{max-width:1000px;margin:0 auto}
    .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.06);margin-bottom:16px}
    .btn{padding:8px 14px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <div class="container">
    <h1>Campus Events</h1>
    <p id="status">Loading events…</p>
    <div id="eventsList"></div>
  </div>

  <script>
    const API_URL = '/api';
    const token = localStorage.getItem('token');

    async function loadEvents(){
      try{
        const res = await fetch(`${API_URL}/events`);
        if(!res.ok) throw new Error('Failed to load events');
        const events = await res.json();
        document.getElementById('status').textContent = `${events.length} events found`;
        const list = document.getElementById('eventsList');
        list.innerHTML = events.map(ev => `
          <div class="card">
            <h3>${ev.title}</h3>
            <p>${ev.description}</p>
            <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
              <div>${new Date(ev.date).toLocaleString()}</div>
              <button class="btn" onclick="register('${ev._id}')">Register</button>
            </div>
          </div>
        `).join('');
      }catch(err){
        document.getElementById('status').textContent = 'Error loading events';
        console.error(err);
      }
    }

    async function register(id){
      if(!token){ alert('Please sign in to register'); window.location.href = 'index.html'; return; }
      try{
        const res = await fetch(`${API_URL}/events/${id}/register`, {
          method: 'POST', headers: { 'Authorization': `Bearer ${token}` }
        });
        const body = await res.json();
        if(!res.ok) return alert(body.message || 'Registration failed');
        alert('Registered successfully');
      }catch(e){ console.error(e); alert('Network error'); }
    }

    loadEvents();
  </script>
</body>
</html>
